name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Same version as locally: the HTML export changes from one version to the next.
  TYPST_VERSION: "0.15.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      # @preview packages (merman) are downloaded on the first build.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/typst
          key: typst-packages-${{ env.TYPST_VERSION }}-${{ hashFiles('**/*.typ') }}
          restore-keys: typst-packages-${{ env.TYPST_VERSION }}-

      - name: Build
        run: sh site/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
