[project]
name = "log791"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["admin", "api", "content", "contracts", "judge", "publisher"]

[dependency-groups]
dev = [
    "import-linter",
]

[tool.uv.workspace]
# apps/web is static and has no pyproject.toml, so members are listed by hand.
members = [
    "apps/admin",
    "apps/api",
    "apps/judge",
    "apps/publisher",
    "packages/content",
    "packages/contracts",
]

[tool.uv.sources]
admin = { workspace = true }
api = { workspace = true }
content = { workspace = true }
contracts = { workspace = true }
judge = { workspace = true }
publisher = { workspace = true }

# Component boundaries (ADR-0014), checked in CI by `lint-imports`.
[tool.importlinter]
root_packages = ["admin", "api", "content", "contracts", "judge", "publisher"]

[[tool.importlinter.contracts]]
name = "The API and the judge never import each other"
type = "independence"
modules = ["api", "judge"]

[[tool.importlinter.contracts]]
name = "Shared packages import no application"
type = "forbidden"
source_modules = ["content", "contracts"]
forbidden_modules = ["admin", "api", "judge", "publisher"]
